<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Demo Projects</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #24292e;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .projects {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin: 15px;
      width: 300px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card h3 {
      margin: 10px 0;
      color: #333;
    }
    .card p {
      color: #666;
      font-size: 14px;
    }
    .card a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
    }
    .card a:hover {
      background: #128C7E;
    }
  </style>
</head>
<body>
  <header>
    <h1>My Demo Projects</h1>
    <p>Explore some of my work</p>
  </header>

  <section class="projects">
    <div class="card">
      <h3>Project 1</h3>
      <p>A simple React app demo.</p>
      <a href="https://github.com/yourusername/project1" target="_blank">View Code</a>
    </div>

    <div class="card">
      <h3>Project 2</h3>
      <p>Laravel API with authentication.</p>
      <a href="https://github.com/yourusername/project2" target="_blank">View Code</a>
    </div>

    <div class="card">
      <h3>Project 3</h3>
      <p>FastAPI + PostgreSQL integration demo.</p>
      <a href="https://github.com/yourusername/project3" target="_blank">View Code</a>
    </div>
  </section>
</body>
</html>
